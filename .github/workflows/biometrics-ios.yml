name: Biometric iOS compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          path: plugin
      - uses: actions/checkout@v5
        with:
          repository: push-in/pam-native
          ref: v1.0.16
          path: sdk
      - name: Prepare isolated plugin package
        run: |
          mkdir -p certification/Sources/PamAuth
          cp plugin/ios/Sources/*.swift certification/Sources/PamAuth/
          cat > certification/Package.swift <<'SWIFT'
          // swift-tools-version: 5.9
          import PackageDescription
          let package = Package(
              name: "PamAuth",
              platforms: [.iOS(.v15)],
              products: [.library(name: "PamAuth", targets: ["PamAuth"])],
              dependencies: [.package(path: "../sdk/ios")],
              targets: [.target(
                  name: "PamAuth",
                  dependencies: [.product(name: "PamNative", package: "ios")],
                  linkerSettings: [.linkedFramework("Security"), .linkedFramework("LocalAuthentication")]
              )]
          )
          SWIFT
      - name: Compile plugin against published SDK
        working-directory: certification
        run: >-
          xcodebuild -scheme PamAuth -configuration Release
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
